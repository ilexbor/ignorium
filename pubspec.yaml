name: ignorium

version: 1.1.0

license: 'BSD-3-Clause'

repository: https://github.com/ilexbor/ignorium

issue_tracker: https://github.com/ilexbor/ignorium/issues

description: "Ignorium is a CLI tool for automatic .gitignore generation based on technologies detected in the target directory."

executables:
  ignorium: ignorium

dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  meta: ^1.16.0
  path: ^1.9.1
  stack_trace: ^1.12.1
  yaml: ^3.1.3

dev_dependencies:
  lintorium: ">=300.0.0"
  pana: "^0.23.19"

environment:
  sdk: '>=3.10.0 <4.0.0'

workspace:
  - example

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - boilerplate
  - codegen
  - cli
  - generator
  - gitignore
